<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>유찬 플레이어</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <section id="setup" class="panel setup">

        <h1>유찬 영상 플레이어</h1>

        <p>
            유튜브 링크를 붙여넣어주세요.
            <br>
            엔터, 쉼표(,), 공백 모두 지원합니다.
        </p>

        <textarea
            id="linksInput"
            placeholder="https://youtu.be/aaa
https://youtu.be/bbb
https://youtu.be/ccc">
        </textarea>

        <button
            class="main-btn"
            onclick="startPlaylist()">
            재생목록 만들기
        </button>

    </section>

    <section id="playerPage" class="player-page">

        <div class="topbar">

            <div>

                <div id="counter"
                     class="counter">
                </div>

                <div id="title"
                     class="title">
                </div>

            </div>

            <div class="top-buttons">

                <button id="autoBtn">
                    자동 다음: ON
                </button>

                <button id="fullscreenBtn">
                    전체 화면 ⛶
                </button>

            </div>

        </div>

        <div id="videoFrame"
             class="video-frame">

            <div id="youtubePlayer"></div>

        </div>

        <div class="progress-wrap">

            <div id="progressBar"
                 class="progress-bar">
            </div>

        </div>

        <div id="progressText"
             class="progress-text">
        </div>

        <div class="buttons">

            <button id="prevBtn">
                ◀ 이전
            </button>

            <button id="openBtn">
                유튜브에서 열기 ▶
            </button>

            <button id="nextBtn">
                다음 ▶
            </button>

        </div>

        <div class="shortcut">

            ␣ 재생/정지
            ·
            ← 이전
            ·
            → 다음
            ·
            F 전체화면
            ·
            A 자동다음

        </div>

    </section>

</div>

<script src="func.js"></script>

</body>
</html>
